[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nervipulsa-telegram-chatbot"
version = "0.2.0"
description = "A restrained Telegram group agent built on the Nervipulsa runtime"
requires-python = ">=3.11"
dependencies = [
    # Pinned to a specific Core commit, never a floating branch. See
    # docs/INTEGRATION_CONTRACT.md before changing this line.
    "nervipulsa @ git+https://github.com/SwufeFox/nervipulsa.git@a6f102f2a51a9c27b07b73ead6e6e209336c250c",
    # The production Telegram transport. Pinned: PTB is pre-1.0-stable in the
    # sense that its async surface moves between minors, and the transport here
    # is written against the Bot methods of exactly this version.
    "python-telegram-bot==22.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nervipulsa-telegram-bot = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
# Keep test scratch inside the repo so a restricted %TEMP% cannot break the suite.
filterwarnings = ["error::DeprecationWarning"]
