# 雾栖 @linGotFoxbot — 不太合群的狐狸
#
# 这是可以直接提交的配置：里面没有密钥。
# TELEGRAM_BOT_TOKEN 只从环境变量读，永远不要写进这个文件。
#
#   $env:TELEGRAM_BOT_TOKEN = "..."
#   $env:TELEGRAM_ALLOWED_CHAT_IDS = "-100xxxxxxxxxx"
#   python -m app.main --config config.fox.toml --check
#   python -m app.main --config config.fox.toml --dry-run

[bot]
name = "雾栖"
# 不带 @。启动时通常会被 getMe 纠正成真实用户名。
username = "linGotFoxbot"

[telegram]
# 只处理这些群。留空则拒绝启动——比不小心裸奔好。
allowed_chat_ids = [8283457993, -1004402809405]
# 谁能用 /pause /resume /stats /purge。填你自己的 user id。
admin_user_ids = [8283457993]
poll_timeout = 25
dry_run = false

[behaviour]
# 一个话题安静多久算说完。狐狸话少，不需要频繁打断。
idle_seconds = 2.0
# 连续聊天时最长等多久也要给它一次机会。
max_batch_seconds = 15.0
# 一次最多喂多少条观察。
max_batch_observations = 24
history_messages = 24

# 模型调用预算；用完时观察仍保留，稍后再处理。
max_activations_per_hour = 60
# 发言限制只作用于投递，不阻止继续接收和理解消息。
max_actions_per_hour = 20
# 不强加固定的发言间隔；每小时发送上限仍然生效。
min_action_interval_seconds = 0.0

[proactive]
# 保留字段，仅对 --replay 的旧路径生效；自主路径不看它。
enabled = false

[model]
provider = "magpie"
base_url = "http://127.0.0.1:3425/v1"
model = "opencode-go/muse-spark-1.3-contributor"
context_limit = 1000000
# 输出上限必须给输入留出空间：provider 会把 input + max_output 一起
# 和模型窗口（1,048,576）比较。设成 1000000 时，只要历史超过约 4.8 万
# token 就会被 400 context_length_exceeded 拒绝——而 context_limit 显示
# 还很宽裕，非常容易误判。狐狸一条消息几十个 token 就够；16k 给推理留余量
# （实测 reasoning 约占输出九成），同时仍为输入留下约 100 万 token 的空间。
max_output_tokens = 16384
request_timeout = 900.0

[runtime]
workspace = "state/fox"
db_path = ""

[profile]
soul_path = "app/prompts/fox-soul.md"
introduction_path = "app/prompts/fox-introduction.md"

[logging]
level = "INFO"
# 交互式控制台：在真终端里运行时默认开启，可输入 status / watch / queue 等命令。
# 重定向输出或跑测试时不会读 stdin；也可以启动时用 --no-console 关掉。
console_enabled = true
# 每分钟打印一次全局状态块（0 关闭）。
log_status_seconds = 60
# 每行消息在日志里显示多少字（0 = 不显示内容）。
log_summary_chars = 0
